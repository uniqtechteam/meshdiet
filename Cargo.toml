[workspace]
resolver = "3"
members = ["crates/meshdiet", "crates/meshdiet-core"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uniqtechteam/meshdiet"
authors = ["UniqTech <https://uniqtech.dev>"]
keywords = ["gltf", "glb", "3d", "performance", "cli"]
categories = ["command-line-utilities", "development-tools", "graphics"]

[workspace.dependencies]
meshdiet-core = { path = "crates/meshdiet-core", version = "0.1.0-dev" }
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
