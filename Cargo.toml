[workspace]
resolver = "3"
members = ["crates/meshdiet", "crates/meshdiet-core", "xtask"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uniqtechteam/meshdiet"
authors = ["UniqTech <https://uniqtech.dev>"]
keywords = ["gltf", "glb", "3d", "performance", "cli"]
categories = ["command-line-utilities", "development-tools", "graphics"]

[workspace.dependencies]
meshdiet-core = { path = "crates/meshdiet-core", version = "0.1.0-dev" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Fixture textures only (xtask); the scanner never decodes images.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

# The fixture generator encodes a few large PNGs; keep the codecs fast in debug test runs.
[profile.dev.package.xtask]
opt-level = 2
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
