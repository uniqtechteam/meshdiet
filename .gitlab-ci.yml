# CI on our own GitLab runner (Linux). GitHub Actions is off while the repo is private.

default:
  image: rust:1-bookworm
  interruptible: true
  before_script:
    - rustup component add rustfmt clippy
  cache:
    key: cargo-$CI_JOB_NAME
    paths: [.cargo/registry, .cargo/git, target/]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:
  script:
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets -- -D warnings

# The fix tests run the real gltfpack: the pinned release zip from tests/fixtures/README.md,
# checked against its SHA-256 before use.
test:
  variables:
    MESHDIET_TEST_GLTFPACK: /usr/local/bin/gltfpack
  script:
    - curl -sSfL -o /tmp/gltfpack.zip https://github.com/zeux/meshoptimizer/releases/download/v1.3/gltfpack-ubuntu.zip
    - echo "0666d9dc40d60fe5b9a45f3fc24f8e6ca87112974bd5de9ca57152aa13d06017  /tmp/gltfpack.zip" | sha256sum -c -
    - command -v unzip || (apt-get update -qq && apt-get install -y -qq unzip)
    - unzip -o /tmp/gltfpack.zip gltfpack -d /usr/local/bin && chmod +x /usr/local/bin/gltfpack
    - cargo test --workspace
    # the tests built target/debug/meshdiet; run it on the demo site like the release does
    - scripts/smoke.sh target/debug/meshdiet /usr/local/bin/gltfpack

# The oldest Rust we promise to build on (rust-version in Cargo.toml).
msrv:
  image: rust:1.88-bookworm
  before_script: []
  script:
    - cargo check --workspace --locked

# What cargo publish would upload, built on its own: catches missing files and metadata
# before a release tag does.
package:
  script:
    - cargo publish --workspace --locked --dry-run

deny:
  script:
    - cargo install --locked cargo-deny
    - cargo deny check
