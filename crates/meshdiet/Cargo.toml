[package]
name = "meshdiet"
description = "Find the 3D models that make your website slow: audits GLB and glTF weight."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# The tests read tests/fixtures at the repository root and build files with xtask; both stay in git.
exclude = ["tests/"]

[dependencies]
meshdiet-core.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
jsonschema.workspace = true
xtask.workspace = true

[lints]
workspace = true

# Has its own main: the test binary doubles as a fake gltfpack (see tests/fix.rs).
[[test]]
name = "fix"
harness = false
