serde_json.workspace = true
ignore.workspace = true
base64.workspace = true
imagesize.workspace = true
ktx2.workspace = true
toml.workspace = true
globset.workspace = true
flate2.workspace = true
memchr.workspace = true
tempfile.workspace = true

[dev-dependencies]
xtask.workspace = true

[lints]
workspace = true
