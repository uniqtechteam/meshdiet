[package]
name = "meshdiet-core"
description = "Engine behind meshdiet: reads GLB and glTF files and reports what makes them heavy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["gltf", "glb", "3d", "performance", "audit"]
categories = ["development-tools", "graphics", "web-programming"]
readme = "README.md"
